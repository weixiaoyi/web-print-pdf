<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-print-pdf · 原生 JS 示例</title>
    <style>
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      h1 {
        font-size: 20px;
      }
      button {
        margin: 4px 8px 4px 0;
        padding: 8px 14px;
        cursor: pointer;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>web-print-pdf · 原生 JS 示例</h1>
    <p>连接状态：<strong id="status">未检查</strong></p>
    <p>
      <button id="check">检查连接</button>
      <button id="html">打印 HTML</button>
      <button id="url">打印网页 URL</button>
      <button id="batch">批量打印 2 个任务</button>
    </p>
    <pre id="log">日志会显示在这里…</pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
